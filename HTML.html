<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="css.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Oswald:wght@200..700&family=Poppins:wght@400;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="body">
    <header id="header" class="header">
      <img id="logo" class="image" src="Dugimail/Frame 8.png" />
    </header>
    <main class="main">
      <div class="main-text">Popular wordpress plugins</div>
      <div class="cards1">
        <div class="rublcon">
          <img class="image1" src="Dugimail/image 43.png" />
          <div class="text_rublcon">Rublcon</div>
          <div class="price_rublcon">100$</div>
          <button id="first_button" class="button1">Buy</button>
        </div>
        <div class="camera">
          <img class="image2" src="Dugimail/image 39.png" />
          <div class="text_camera">Camera</div>
          <div class="price_camera">200$</div>
          <button id="second_button" class="button2">Buy</button>
        </div>
      </div>
      <div class="cards2">
        <div class="generator">
          <img class="image3" src="Dugimail/image 38.png" />
          <div class="text_generator">G Generator</div>
          <div class="price_generator">1000$</div>
          <button id="third_button" class="button3">Buy</button>
        </div>
        <div class="creator">
          <img class="image4" src="Dugimail/image 36.png" />
          <div class="text_creator">Invoice Creator</div>
          <div class="price_creator">100$</div>
          <button id="fourth_button" class="button4">Buy</button>
        </div>
      </div>
    </main>
    <footer id="footer" class="footer">
      <div class="text_footer">
        <div class="rights">© DUGIMAIL. All rights reserved.</div>
        <div class="contacs">
          If you have any questions please contact us sabrihakuli@outlook.com
        </div>
      </div>
      <div class="image_footer">
        <img class="image-footer1" src="Dugimail/Vector.svg" />
        <img class="image-footer2" src="Dugimail/Frame.svg" />
        <img class="image-footer3" src="Dugimail/Frame (1).svg" />
        <img class="image-footer4" src="Dugimail/Frame (2).svg" />
        <img class="image-footer5" src="Dugimail/Frame (3).svg" />
      </div>
      <button id="footer_button" class="footer_button">
        вернутся в начало макета
      </button>
    </footer>
    <script src="JS.js"></script>
  </body>
</html>
